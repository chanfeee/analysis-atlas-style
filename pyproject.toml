[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-atlas-style"
dynamic = ["version"]
description = "A lightweight ATLAS style layer for Matplotlib and ROOT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/chanfeee/analysis-atlas-style"

[project.optional-dependencies]
mpl = [
    "matplotlib>=3.11.2,<3.12",
    "mplhep>=1.3.3,<1.4",
    "mplhep-data>=0.1.0,<0.2",
]

[project.scripts]
atlas-style = "ana_atlas_style.__main__:main"

[tool.setuptools]
packages = ["ana_atlas_style", "ana_atlas_style.root"]
package-dir = {ana_atlas_style = "."}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "ana_atlas_style.__version__"}

[tool.setuptools.package-data]
ana_atlas_style = ["README.md", "README.en.md"]
"ana_atlas_style.root" = ["*.h"]
