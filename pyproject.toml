[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis-atlas-style"
dynamic = ["version"]
description = "A lightweight ATLAS style layer for Matplotlib and ROOT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/chanfeee/analysis-atlas-style"

[project.optional-dependencies]
mpl = [
    "matplotlib>=3.11.2,<3.12",
    "mplhep>=1.3.3,<1.4",
    "mplhep-data>=0.1.0,<0.2",
]

[project.scripts]
atlas-style = "plotting.__main__:main"

[tool.setuptools]
packages = ["plotting", "plotting.root"]
package-dir = {plotting = "."}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "plotting.__version__"}

[tool.setuptools.package-data]
plotting = ["README.md"]
"plotting.root" = ["*.h"]
